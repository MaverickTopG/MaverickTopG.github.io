<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoLink - Admin Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-auth-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-firestore-compat.min.js"></script>
<style>

:root {
  --accent: #ffbe0b;
  --accent-dark: #e6a700;
  --accent-light: #ffd633;
  --white-85: rgba(255,255,255,0.85);
  --white-90: rgba(255,255,255,0.9);
  --black: #000;
  --bg-image: url('lol.png');
  --text-dark: #333;
  --text-light: #666;
  --card-bg: rgba(255,255,255,0.95);
  --input-bg: #fff;
  --shadow-soft: 0 8px 32px rgba(0,0,0,0.12);
  --shadow-medium: 0 12px 40px rgba(0,0,0,0.15);
  --shadow-strong: 0 20px 60px rgba(0,0,0,0.25);
  --gradient-primary: linear-gradient(135deg, #ffbe0b 0%, #ffd633 100%);
  --gradient-glow: linear-gradient(135deg, rgba(255,190,11,0.3) 0%, rgba(255,214,51,0.3) 100%);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-image) no-repeat center/cover fixed;
  color: var(--text-dark);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 2rem;
  position: relative;
  overflow-x: hidden;
}

/* Animated background overlay */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: 
    radial-gradient(circle at 20% 80%, rgba(255,190,11,0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255,214,51,0.08) 0%, transparent 50%),
    linear-gradient(45deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.05) 100%);
  animation: backgroundFloat 15s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes backgroundFloat {
  0%, 100% { opacity: 0.8; transform: translateY(0px); }
  50% { opacity: 1; transform: translateY(-10px); }
}

/* Floating particles */
body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, rgba(255,190,11,0.3), transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,214,51,0.2), transparent),
    radial-gradient(1px 1px at 90px 40px, rgba(255,190,11,0.4), transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,214,51,0.3), transparent);
  background-repeat: repeat;
  background-size: 150px 100px;
  animation: particleFloat 20s linear infinite;
  pointer-events: none;
  z-index: 1;
}

@keyframes particleFloat {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-100px); }
}

/* NAVBAR */
.navbar {
  position: fixed; 
  top: 0; 
  left: 0; 
  right: 0;
  background: var(--white-85); 
  backdrop-filter: blur(15px) saturate(180%);
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  padding: 1rem 2rem;
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  z-index: 1000;
  border-bottom: 1px solid rgba(255,255,255,0.3);
  animation: slideDown 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideDown {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.navbar .logo {
  font-size: 1.75rem; 
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.navbar .nav-links {
  display: flex; 
  gap: 1.5rem;
}

.navbar .nav-links a {
  padding: 0.5rem 1rem; 
  font-weight: 600;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--black);
  text-decoration: none;
  border-radius: 25px;
  position: relative;
  overflow: hidden;
}

.navbar .nav-links a::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: var(--gradient-primary);
  transition: left 0.3s ease;
  z-index: -1;
  border-radius: 25px;
}

.navbar .nav-links a:hover::before {
  left: 0;
}

.navbar .nav-links a:hover {
  color: var(--black);
  transform: translateY(-2px);
  box-shadow: var(--shadow-medium);
}

/* Current page indicator */
.navbar .nav-links a.current {
  background: var(--gradient-primary);
  color: var(--black);
  box-shadow: var(--shadow-medium);
}

.auth-container {
  width: 100%;
  max-width: 450px;
  background: var(--card-bg);
  border-radius: 24px;
  padding: 3rem 2.5rem;
  box-shadow: var(--shadow-strong);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.3);
  position: relative;
  z-index: 10;
  animation: containerEntry 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  margin-top: 80px;
}

@keyframes containerEntry {
  0% { 
    transform: scale(0.9) translateY(40px); 
    opacity: 0;
    filter: blur(10px);
  }
  60% {
    transform: scale(1.02) translateY(-5px);
    opacity: 0.8;
  }
  100% { 
    transform: scale(1) translateY(0); 
    opacity: 1;
    filter: blur(0px);
  }
}

/* Glowing border effect */
.auth-container::before {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  background: var(--gradient-primary);
  border-radius: 26px;
  z-index: -1;
  opacity: 0;
  animation: borderGlow 3s ease-in-out infinite alternate;
}

@keyframes borderGlow {
  0% { opacity: 0; }
  100% { opacity: 0.3; }
}

.auth-header {
  text-align: center;
  margin-bottom: 2.5rem;
}

.auth-header h1 {
  font-size: 2.5rem;
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
  animation: titleGlow 2s ease-in-out infinite alternate;
}

@keyframes titleGlow {
  0% { filter: brightness(1); }
  100% { filter: brightness(1.1) drop-shadow(0 0 10px rgba(255,190,11,0.3)); }
}

.auth-header p {
  color: var(--text-light);
  font-size: 1.1rem;
  font-weight: 500;
}

/* Toggle buttons */
.toggle-buttons {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 2.5rem;
  position: relative;
  background: rgba(255,255,255,0.5);
  border-radius: 40px;
  padding: 4px;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-soft);
}

.toggle-buttons button {
  flex: 1;
  padding: 1rem 2rem;
  border-radius: 35px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border: none;
  background: transparent;
  color: var(--text-light);
  position: relative;
  z-index: 1;
  font-size: 0.95rem;
}

.toggle-buttons button::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--gradient-primary);
  border-radius: 35px;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: -1;
}

.toggle-buttons button.active::before {
  opacity: 1;
  transform: scale(1);
}

.toggle-buttons button.active {
  color: var(--black);
  font-weight: 700;
  box-shadow: var(--shadow-medium);
  transform: translateY(-2px);
}

.toggle-buttons button:hover:not(.active) {
  color: var(--text-dark);
  transform: translateY(-1px);
}

/* Form sections */
.auth-form {
  opacity: 0;
  animation: formSlideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.auth-form.hidden {
  display: none;
}

@keyframes formSlideIn {
  0% { 
    transform: translateX(-30px) translateY(20px); 
    opacity: 0;
    filter: blur(5px);
  }
  100% { 
    transform: translateX(0) translateY(0); 
    opacity: 1;
    filter: blur(0px);
  }
}

/* Form groups */
.form-group {
  margin-bottom: 1.8rem;
  opacity: 0;
  animation: formSlideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

.form-group:nth-child(1) { animation-delay: 0.1s; }
.form-group:nth-child(2) { animation-delay: 0.2s; }
.form-group:nth-child(3) { animation-delay: 0.3s; }

label {
  display: block;
  margin-bottom: 0.8rem;
  font-weight: 600;
  color: var(--text-dark);
  font-size: 0.95rem;
  letter-spacing: 0.5px;
}

input {
  width: 100%;
  padding: 1.2rem 1.5rem;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 16px;
  background: var(--input-bg);
  font-size: 1rem;
  font-family: inherit;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

input::placeholder {
  color: var(--text-light);
  opacity: 0.7;
}

input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 
    0 0 0 4px rgba(255,190,11,0.15),
    0 8px 25px rgba(255,190,11,0.2);
  transform: translateY(-2px);
  background: rgba(255,255,255,0.95);
}

input:hover:not(:focus) {
  border-color: rgba(255,190,11,0.6);
  transform: translateY(-1px);
}

/* Buttons */
button.btn-primary {
  display: inline-block;
  width: 100%;
  padding: 1.2rem 2rem;
  margin-top: 1rem;
  border-radius: 50px;
  font-weight: 700;
  font-size: 1rem;
  border: none;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-size: 0.9rem;
  background: var(--gradient-primary);
  color: var(--black);
  box-shadow: var(--shadow-medium);
}

button.btn-primary::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: left 0.6s ease;
}

button.btn-primary:hover::before {
  left: 100%;
}

button.btn-primary:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-strong);
  filter: brightness(1.1);
}

button.btn-primary:active {
  transform: translateY(-2px) scale(0.98);
}

button.btn-primary:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

/* Messages */
.message {
  margin: 1.5rem 0;
  padding: 1.2rem 1.5rem;
  border-radius: 16px;
  opacity: 0;
  animation: messageSlide 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
  font-weight: 500;
}

.message::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: messageShine 2s ease-in-out;
}

@keyframes messageShine {
  0% { left: -100%; }
  100% { left: 100%; }
}

@keyframes messageSlide {
  0% { 
    transform: translateY(20px) scale(0.95); 
    opacity: 0;
    filter: blur(5px);
  }
  100% { 
    transform: translateY(0) scale(1); 
    opacity: 1;
    filter: blur(0px);
  }
}

.message.error { 
  background: linear-gradient(135deg, rgba(248,215,218,0.9) 0%, rgba(248,215,218,0.7) 100%);
  color: #842029; 
  border-left: 4px solid #dc3545;
}

.message.success { 
  background: linear-gradient(135deg, rgba(209,231,221,0.9) 0%, rgba(209,231,221,0.7) 100%);
  color: #0f5132; 
  border-left: 4px solid #198754;
}

.message.info {
  background: linear-gradient(135deg, rgba(255,243,205,0.9) 0%, rgba(255,243,205,0.7) 100%);
  color: #664d03;
  border-left: 4px solid var(--accent);
}

/* Success state */
.success-state {
  text-align: center;
  padding: 2rem 0;
}

.success-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 1.5rem;
  background: var(--gradient-primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: successPulse 2s ease-in-out infinite;
  box-shadow: var(--shadow-medium);
}

@keyframes successPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.success-icon svg {
  width: 40px;
  height: 40px;
  fill: var(--black);
}

.org-code-display {
  background: rgba(255,190,11,0.1);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 1.5rem;
  margin: 1.5rem 0;
  text-align: center;
}

.org-code {
  font-size: 1.5rem;
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
  display: block;
  margin: 0.5rem 0;
}

/* Responsive design */
@media (max-width: 768px) {
  .auth-container {
    width: 95vw;
    padding: 2rem 1.5rem;
    border-radius: 20px;
    margin-top: 60px;
  }
  
  .navbar {
    padding: 0.8rem 1rem;
  }
  
  .navbar .logo {
    font-size: 1.5rem;
  }
  
  .navbar .nav-links {
    gap: 1rem;
  }
  
  .navbar .nav-links a {
    padding: 0.4rem 0.8rem;
    font-size: 0.9rem;
  }
  
  .auth-header h1 {
    font-size: 2rem;
  }
  
  .toggle-buttons {
    flex-direction: column;
    gap: 0.5rem;
  }
  
  .toggle-buttons button {
    padding: 0.8rem 1.5rem;
  }
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
  .auth-container {
    background: rgba(30,30,30,0.95);
    color: #e0e0e0;
  }
  
  input {
    background: rgba(60,60,60,0.8);
    color: #e0e0e0;
    border-color: rgba(255,255,255,0.2);
  }
  
  .navbar {
    background: rgba(30,30,30,0.85);
  }
}

/* Focus indicators for accessibility */
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Reduced motion for accessibility */
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Loading state */
.loading {
  position: relative;
  pointer-events: none;
}

.loading::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(255,255,255,0.8);
  border-radius: inherit;
  backdrop-filter: blur(2px);
}

</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">NexoLink</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="privacy_policy.html">Privacy Policy</a>
      <a href="#" class="current">Admin Portal</a>
    </div>
  </nav>

  <div class="auth-container">
    <!-- Auth Header -->
    <div class="auth-header">
      <h1>Admin Portal</h1>
      <p>Secure access for administrators</p>
    </div>

    <!-- Toggle Buttons -->
    <div class="toggle-buttons">
      <button id="signInToggle" class="active" onclick="toggleForm('signIn')">Sign In</button>
      <button id="signupToggle" onclick="toggleForm('signup')">Create Account</button>
    </div>

    <!-- Sign In Form -->
    <div id="signInForm" class="auth-form">
      <div class="form-group">
        <label for="signInEmail">Email Address</label>
        <input type="email" id="signInEmail" placeholder="Enter your email" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signInPassword">Password</label>
        <input type="password" id="signInPassword" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button type="button" class="btn-primary" onclick="signIn()">Sign In</button>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="auth-form hidden">
      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Create password (min 6 characters)" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="organizationName">Organization Name</label>
        <input type="text" id="organizationName" placeholder="Enter your organization name" autocomplete="organization">
      </div>
      <button type="button" class="btn-primary" onclick="signup()">Create Account</button>
    </div>

    <!-- Success State -->
    <div id="successState" class="auth-form hidden">
      <div class="success-state">
        <div class="success-icon">
          <svg viewBox="0 0 24 24">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
        </div>
        <h3>Account Created Successfully!</h3>
        <div id="orgCodeDisplay" class="org-code-display">
          <p><strong>Your Organization Code:</strong></p>
          <span id="displayOrgCode" class="org-code"></span>
          <p style="font-size: 0.9rem; color: var(--text-light); margin-top: 1rem;">
            Share this code with volunteers to register under your organization.
          </p>
        </div>
        <button type="button" class="btn-primary" onclick="proceedToDashboard()">Continue to Dashboard</button>
      </div>
    </div>

    <!-- Messages -->
    <div id="authMessage"></div>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC1kY4dlbg9v38ZkuYVPJGnSulMEouvw58",
      authDomain: "nexolink-b8eb5.firebaseapp.com",
      projectId: "nexolink-b8eb5",
      storageBucket: "nexolink-b8eb5.appspot.com",
      messagingSenderId: "247675121621",
      appId: "1:247675121621:web:98772b2e0cfbe8a381175c"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Toggle between forms
    function toggleForm(type) {
      // Hide all forms
      document.getElementById('signInForm').classList.add('hidden');
      document.getElementById('signupForm').classList.add('hidden');
      document.getElementById('successState').classList.add('hidden');
      
      // Update toggle buttons
      document.getElementById('signInToggle').classList.remove('active');
      document.getElementById('signupToggle').classList.remove('active');
      
      // Show selected form
      document.getElementById(type + 'Form').classList.remove('hidden');
      document.getElementById(type + 'Toggle').classList.add('active');
      
      // Clear any messages
      clearMessage();
    }

    // Generate random organization code
    function generateOrganizationCode() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < 8; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // Check if organization code already exists
    async function isOrganizationCodeUnique(code) {
      try {
        const querySnapshot = await db.collection('users')
          .where('organizationCode', '==', code)
          .where('role', '==', 'admin')
          .get();
        return querySnapshot.empty;
      } catch (error) {
        console.error('Error checking organization code uniqueness:', error);
        return false;
      }
    }

    // Generate unique organization code
    async function generateUniqueOrganizationCode() {
      let code;
      let isUnique = false;
      let attempts = 0;
      
      while (!isUnique && attempts < 10) {
        code = generateOrganizationCode();
        isUnique = await isOrganizationCodeUnique(code);
        attempts++;
      }
      
      if (!isUnique) {
        throw new Error('Unable to generate unique organization code. Please try again.');
      }
      
      return code;
    }

    // Sign up function
    async function signup() {
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const organizationName = document.getElementById('organizationName').value.trim();
      
      if (!email || !password || !organizationName) {
        showMessage('Please fill in all fields', 'error');
        return;
      }
      
      if (password.length < 6) {
        showMessage('Password must be at least 6 characters long', 'error');
        return;
      }
      
      // Add loading state
      const signupBtn = document.querySelector('#signupForm .btn-primary');
      signupBtn.classList.add('loading');
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating Account...';
      
      try {
        showMessage('Creating your admin account...', 'info');
        
        // Generate unique organization code
        const organizationCode = await generateUniqueOrganizationCode();
        
        // Create user account
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Store admin data
        await db.collection('users').doc(user.uid).set({
          uid: user.uid,
          email: email,
          role: 'admin',
          organizationCode: organizationCode,
          organizationName: organizationName,
          volunteers: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Show success state
        showSuccessState(organizationCode, organizationName);
        
      } catch (error) {
        console.error('Signup error:', error);
        showMessage('Error: ' + error.message, 'error');
      } finally {
        // Remove loading state
        signupBtn.classList.remove('loading');
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    }

    // Sign in function
    async function signIn() {
      const email = document.getElementById('signInEmail').value.trim();
      const password = document.getElementById('signInPassword').value;
      
      if (!email || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }
      
      // Add loading state
      const signInBtn = document.querySelector('#signInForm .btn-primary');
      signInBtn.classList.add('loading');
      signInBtn.disabled = true;
      signInBtn.textContent = 'Signing In...';
      
      try {
        showMessage('Signing you in...', 'info');
        
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;
        
        // Verify user is an admin
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          const userData = userDoc.data();
          
          if (userData.role !== 'admin') {
            await auth.signOut();
            showMessage('Access denied. This portal is for administrators only.', 'error');
            return;
          }
          
          // Successful sign in
          showMessage('Sign in successful! Redirecting to dashboard...', 'success');
          
          // Redirect to dashboard after a short delay
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 2000);
          
        } else {
          await auth.signOut();
          showMessage('Admin account not found', 'error');
        }
        
      } catch (error) {
        console.error('Sign in error:', error);
        let errorMessage = 'Sign in failed. ';
        
        switch (error.code) {
          case 'auth/user-not-found':
            errorMessage += 'No account found with this email.';
            break;
          case 'auth/wrong-password':
            errorMessage += 'Incorrect password.';
            break;
          case 'auth/invalid-email':
            errorMessage += 'Invalid email address.';
            break;
          case 'auth/too-many-requests':
            errorMessage += 'Too many failed attempts. Please try again later.';
            break;
          default:
            errorMessage += error.message;
        }
        
        showMessage(errorMessage, 'error');
      } finally {
        // Remove loading state
        const signInBtn = document.querySelector('#signInForm .btn-primary');
        signInBtn.classList.remove('loading');
        signInBtn.disabled = false;
        signInBtn.textContent = 'Sign In';
      }
    }

    // Show success state after account creation
    function showSuccessState(organizationCode, organizationName) {
      // Hide other forms
      document.getElementById('signInForm').classList.add('hidden');
      document.getElementById('signupForm').classList.add('hidden');
      
      // Show success state
      document.getElementById('successState').classList.remove('hidden');
      document.getElementById('displayOrgCode').textContent = organizationCode;
      
      // Clear messages
      clearMessage();
      
      // Update toggle buttons to show success
      document.getElementById('signInToggle').classList.remove('active');
      document.getElementById('signupToggle').classList.remove('active');
    }

    // Navigate to dashboard after successful signup
    function proceedToDashboard() {
      showMessage('Redirecting to dashboard...', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    }

    // Reset to sign in form (legacy function for compatibility)
    function resetToSignIn() {
      proceedToDashboard();
    }

    // Show message helper
    function showMessage(message, type) {
      const messageDiv = document.getElementById('authMessage');
      messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
      
      // Auto-clear success and info messages
      if (type === 'success' || type === 'info') {
        setTimeout(() => {
          clearMessage();
        }, 5000);
      }
    }

    // Clear message helper
    function clearMessage() {
      document.getElementById('authMessage').innerHTML = '';
    }

    // Handle auth state changes
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists && userDoc.data().role === 'admin') {
            // User is already signed in as admin, redirect to dashboard
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          }
        } catch (error) {
          console.error('Error checking user status:', error);
        }
      }
    });

    // Enable Enter key for form submission
    document.addEventListener('DOMContentLoaded', () => {
      // Sign in form
      document.getElementById('signInEmail').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('signInPassword').focus();
        }
      });
      
      document.getElementById('signInPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          signIn();
        }
      });
      
      // Signup form
      document.getElementById('signupEmail').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('signupPassword').focus();
        }
      });
      
      document.getElementById('signupPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('organizationName').focus();
        }
      });
      
      document.getElementById('organizationName').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          signup();
        }
      });
    });

    // Auto sign-out on browser/tab close (but not on refresh)
    window.addEventListener('beforeunload', () => {
      const navEntries = performance.getEntriesByType("navigation");
      const navType = navEntries.length && navEntries[0].type;
      
      if (navType !== 'reload') {
        // Fire-and-forget sign out
        auth.signOut().catch(() => {/* ignore errors */});
      }
    });

    // Form validation enhancements
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    function validatePassword(password) {
      return password.length >= 6;
    }

    // Real-time validation feedback
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('input');
      
      inputs.forEach(input => {
        input.addEventListener('blur', () => {
          validateInput(input);
        });
        
        input.addEventListener('input', () => {
          // Clear validation styles while typing
          input.style.borderColor = '';
        });
      });
    });

    function validateInput(input) {
      let isValid = true;
      
      switch (input.type) {
        case 'email':
          isValid = validateEmail(input.value);
          break;
        case 'password':
          isValid = validatePassword(input.value);
          break;
        default:
          isValid = input.value.trim().length > 0;
      }
      
      if (!isValid && input.value.trim().length > 0) {
        input.style.borderColor = '#dc3545';
      } else {
        input.style.borderColor = '';
      }
    }

  </script>
</body>
</html>
